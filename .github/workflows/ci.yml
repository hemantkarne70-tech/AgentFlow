name: AgentFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          APP_ENV: testing
          DEBUG: 'false'
          DATABASE_URL: sqlite:///./agentflow_ci.db
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment files
        shell: bash
        run: |
          test -f Dockerfile
          test -f compose.yaml || test -f docker-compose.yml

      - name: Build API image
        run: docker build --tag agentflow:ci .
