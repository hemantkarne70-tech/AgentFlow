services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [agentflow]
  api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/agentflow.db
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: [agentflow_data:/data]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [agentflow]
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--pool=solo"]
    env_file: [.env]
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite:////data/agentflow.db
      REDIS_URL: redis://redis:6379/0
    volumes: [agentflow_data:/data]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [agentflow]
volumes:
  agentflow_data:
  redis_data:
networks:
  agentflow:
    driver: bridge
